<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=320, initial-scale=1">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; width: 320px; padding: 16px; background: #1a1a2e; color: #e0e0e0; }
    h1 { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: #fff; }
    .status { font-size: 13px; padding: 10px; border-radius: 8px; margin-bottom: 12px; }
    .ok { background: #1b4332; border: 1px solid #2d6a4f; color: #95d5b2; }
    .error { background: #3d1f1f; border: 1px solid #6b2a2a; color: #e5989b; }
    .info { background: #1e2a4a; border: 1px solid #3a4f8a; color: #a8c0ff; }
    textarea { width: 100%; font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace; font-size: 13px; padding: 10px; border: 1px solid #333; border-radius: 8px; background: #16213e; color: #e0e0e0; resize: vertical; min-height: 60px; outline: none; }
    textarea:focus { border-color: #4a6cf7; }
    label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 6px; color: #a0a0c0; }
    button { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 8px; }
    .btn-primary { background: #4a6cf7; color: #fff; }
    .btn-primary:hover { background: #5b7bf8; }
    .btn-danger { background: #6b2a2a; color: #e5989b; }
    .btn-danger:hover { background: #8a3535; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .hint { font-size: 11px; color: #707090; margin-top: 6px; line-height: 1.4; }
    .hidden { display: none; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #4a6cf7; border-top-color: transparent; border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h1>TUWEL Auto 2FA</h1>
  <div id="status" class="status info">Checking...</div>

  <div id="configuredView" class="hidden">
    <p style="font-size:13px;margin-bottom:8px;color:#a0a0c0;">TOTP seed is stored in your system keychain.</p>
    <button id="deleteBtn" class="btn-danger">Remove Seed</button>
  </div>

  <div id="setupView" class="hidden">
    <label for="seedInput">Paste your TOTP secret key (base32)</label>
    <textarea id="seedInput" placeholder="e.g. JBSWY3DPEHPK3PXP"></textarea>
    <div class="hint">Your secret key stays in your OS keychain (Apple Keychain / KDE Wallet / libsecret). Never leaves your device.</div>
    <button id="saveBtn" class="btn-primary" disabled>Save to Keychain</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
