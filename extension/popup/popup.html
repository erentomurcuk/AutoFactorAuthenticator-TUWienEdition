<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=300, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>TU Wien Auto 2FA</h1>
  <div id="status" class="status info">Checking...</div>

  <!-- Dashboard (seed configured) -->
  <div id="dashboardView" class="hidden">
    <div class="totp-label">Current TOTP</div>
    <div class="totp-code" id="totpCode">------</div>
    <div class="totp-actions">
      <button id="copyBtn" class="btn-icon" title="Copy to clipboard">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </button>
      <button id="refreshBtn" class="btn-icon" title="New code">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      </button>
    </div>
    <div class="totp-timer">
      <div class="timer-bar" id="timerBar"></div>
    </div>
    <span class="timer-text" id="timerText"></span>

    <div id="copiedToast" class="copied-toast hidden">Copied to clipboard!</div>

    <div class="divider"></div>

    <button id="deleteBtn" class="btn-danger">Remove Seed</button>
    <div id="confirmDelete" class="hidden confirm-box">
      <p>Remove seed from keychain?</p>
      <button id="confirmYesBtn" class="btn-danger">Yes, Remove</button>
      <button id="confirmNoBtn" class="btn-secondary">Cancel</button>
    </div>
  </div>

  <!-- Setup (no seed) -->
  <div id="setupView" class="hidden">
    <label for="seedInput">TOTP secret key (base32)</label>
    <textarea id="seedInput" placeholder="JBSWY3DPEHPK3PXP" spellcheck="false" autocomplete="off"></textarea>
    <div class="hint">Stored in your <span id="keychainName">keychain</span>. Never leaves your device.</div>
    <button id="saveBtn" class="btn-primary" disabled>Save</button>
  </div>

  <p class="footer">
    Not an official TU Wien tool. Self-made project, provided AS IS. You are responsible for any damages.
  </p>

  <script src="popup.js"></script>
</body>
</html>
