[package]
name = "autotiss2fa-native"
version = "1.2.0"
edition = "2021"
license = "MIT"
description = "Native messaging host for AutoTISS2FA — stores the TOTP seed in the OS keychain (AutoFactorAuthenticator)"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
byteorder = "1.5.0"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service"] }
